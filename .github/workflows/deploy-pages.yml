name: Deploy Bookmarklet Launcher to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run site tests
        run: node --experimental-default-type=module --test
      - uses: actions/configure-pages@v5
      - name: Assemble Pages artifact
        run: |
          mkdir dist
          cp -R index.html install.html install.en.html privacy.html assets converter shared bookmarklets bookmarklets_screenshot dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
