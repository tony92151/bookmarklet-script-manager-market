<h1 data-i18n="title">從安裝到第一次執行</h1><p class="intro" data-i18n="intro">跟著五個步驟安裝擴充功能、匯入指令碼，並在支援的網站執行。</p>
<div class="layout"><div class="steps">
<button class="step active" data-scene="0"><b><span>01</span><strong data-i18n="step0">安裝擴充功能</strong></b><small data-i18n="desc0">在 Chrome 線上應用程式商店點選「加到 Chrome」，確認安裝。</small></button>
<button class="step" data-scene="1"><b><span>02</span><strong data-i18n="step1">在 Market 複製連結</strong></b><small data-i18n="desc1">在 BOOKMARKLET Market 選擇工具，點選「複製 GitHub 連結」。</small></button>
<button class="step" data-scene="2"><b><span>03</span><strong data-i18n="step2">開啟指令碼管理器</strong></b><small data-i18n="desc2">點選擴充功能圖示，再點彈出視窗底部的「管理指令碼」。</small></button>
<button class="step" data-scene="3"><b><span>04</span><strong data-i18n="step3">貼上連結並儲存</strong></b><small data-i18n="desc3">在管理頁切到 GitHub 分頁，貼上連結並儲存。</small></button>
<button class="step" data-scene="4"><b><span>05</span><strong data-i18n="step4">到適用網站執行</strong></b><small data-i18n="desc4">開啟 StayMiles 飯店頁，從擴充功能點選已儲存的指令碼。</small></button>
<p class="footnote" data-i18n="footnote">介面示意，Chrome 對話框可能不同。GitHub 匯入需要 1.2.1 或更新版本。截圖與指令碼保留原始語言；擴充功能可用語言依安裝版本而定。 Chrome 對話框使用瀏覽器語言。</p>
